name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,launcher]
      - name: ruff check
        run: ruff check src tests tools
      - name: ruff format --check
        run: ruff format --check src tests tools

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,launcher]
      - name: pytest
        run: pytest

  smoke-build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: te-builder
      - name: Clone te-external (public sibling)
        run: git clone --depth 1 https://github.com/mazoea/te-external.git te-external
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install te-builder
        working-directory: te-builder
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,launcher]
      - name: Dry-run externals.basic preset
        working-directory: te-builder
        run: python -m te_builder --preset externals.basic --dry-run
